# Retry a failed day on the next timer run, and skip once the day has succeeded.
#
# The timer fires every 6 hours. A run is skipped (not counted as a failure, no alert, no sign-in)
# if the stamp file is dated today. The stamp is touched as the LAST step of a successful run, so
# keep this file sorting after any drop-in that adds your own ExecStartPost= steps: drop-ins are
# applied in name order, and a run whose post-step fails is then retried too.
[Service]
ExecCondition=/bin/sh -c 'S=/var/lib/esbn-hdf-download/last_success; [ ! -e "$S" ] || [ "$(date -r "$S" +%%F)" != "$(date +%%F)" ]'
ExecStartPost=/usr/bin/touch /var/lib/esbn-hdf-download/last_success
